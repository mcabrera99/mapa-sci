<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa SCI</title>
    <link rel="icon" href="icons/peligro_biol.png">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
    <div id="contenedor">
        <div id="panel_izq">
            <div id="panel_config">

            </div>
            <div id="panel_simbolos">
                <div class="contenedor_simbolo" id="sci_pc">
                    <img class="simbolo" src="icons/sci_pc.png">
                    <p>Puesto de comando</p>
                    <button class="btn_trash" id="btn_trash_sci_pc">
                        <img src="icons/trash.png">
                    </button>
                    <button class="btn_descargar" id="btn_descargar_sci_pc">
                        <img src="icons/descargar.png">
                    </button>
                </div>
                <div class="contenedor_simbolo" id="sci_e">
                    <img class="simbolo" src="icons/sci_e.png">
                    <p>Área de espera</p>
                    <button class="btn_descargar" id="btn_descargar_sci_e">
                        <img src="icons/descargar.png">
                    </button>
                </div>
                <div class="contenedor_simbolo" id="peligro_biol">
                    <img class="simbolo" src="icons/riesgo_biol.png">
                    <p>Peligro biológico</p>
                    <button class="btn_descargar" id="btn_descargar_pel_biol">
                        <img src="icons/descargar.png">
                    </button>
                </div>

            </div>

        </div>
        <div id="mapa">
        </div>
    </div>
    <script type="module" src="src/main.js"></script>
</body>

</html>
